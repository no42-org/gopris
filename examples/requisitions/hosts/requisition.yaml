#
# Example requisition: a CSV inventory mapped declaratively onto OpenNMS nodes,
# with a Starlark script deriving a category. Served at GET /requisitions/hosts.

foreign-source: hosts
ttl: 5m

source:
  type: csv
  file: nodes.csv

transform:
  foreign-id: "${id}"
  node-label: "${name}"
  location: "${location}"
  interfaces:
    - ip-addr: "${ip}"
      snmp-primary: "P"
      status: 1
      services:
        - ICMP
        - SNMP
  assets:
    - name: vendor
      value: "${vendor}"
  metadata:
    - context: gopris
      key: source
      value: csv
  # Escape hatch: derive fields the declarative form can't express.
  script: transform.star
